[project]
name = "creditsentinel"
version = "0.1.0"
description = "Real-time credit-risk decisioning service with governed ML + grounded LLM explainability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "fairlearn>=0.10.0",
    "shap>=0.46",
    "numba>=0.60",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "mlflow>=2.17",
    "httpx>=0.27",
    "matplotlib>=3.8",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
creditsentinel-train = "creditsentinel.models.train:main"
creditsentinel-drift = "creditsentinel.monitoring.drift:main"
creditsentinel-aggregate = "creditsentinel.features.aggregate:main"
creditsentinel-cost-optimize = "creditsentinel.cost:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditsentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["creditsentinel"]
omit = ["*/train.py", "*/ingest.py"]
